[project]
name = "pacman"
version = "0.1.0"
description = "Modular Pac-Man game in Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame==2.5.2",
    "dataclasses-json==0.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "mypy==1.7.1",
    "flake8==6.1.0",
    "types-setuptools==69.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
